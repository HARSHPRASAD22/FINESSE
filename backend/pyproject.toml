[project]
name = "permitpilot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "python-multipart>=0.0.20",
  "httpx>=0.28",
  "beautifulsoup4>=4.13",
  "pypdf>=5.0",
  "reportlab>=4.4",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=9.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
